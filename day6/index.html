<!DOCTYPE html>
<html>
<head>
    <title>Day 6 - API</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f2f2f2;
        }

        h1 {
            margin-top: 30px;
        }

        #products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <h1>Product Search</h1>

    <p id="message">Loading products...</p>

    <div id="products"></div>

    <script>

        async function getProducts() {

            try {

                const response =
                    await fetch("https://dummyjson.com/products?limit=5");

                const data = await response.json();

                const products = data.products;

                document.getElementById("message").innerText =
                    "Products Loaded Successfully";

                document.getElementById("products").innerHTML =
                    products.map(product => `
                        <div class="card">
                            <img src="${product.thumbnail}">
                            <h2>${product.title}</h2>
                            <p>Price: $${product.price}</p>
                        </div>
                    `).join("");

            } catch (error) {

                document.getElementById("message").innerText =
                    "Error loading products.";

            }
        }

        getProducts();

    </script>

</body>
</html>
