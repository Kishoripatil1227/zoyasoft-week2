<!DOCTYPE html>
<html>
<head>
    <title>Day 4 - Modern JavaScript</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px; }
         h1 {
            text-align: center;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        .product {
            padding: 10px;
            margin: 5px 0;
            background: #f2f2f2;
            border-radius: 5px;
        }
    </style>
</head>
<body>
     <h1>Day 4 - Modern JavaScript</h1>
     <div class="section">
        <h2>1. Template Literal</h2>
        <p id="message"></p>
    </div>
    <div class="section">
        <h2>2. Products Under ₹1000</h2>
        <div id="cheapProducts"></div>
    </div>
    <div class="section">
        <h2>3. Product Names</h2>
        <p id="productNames"></p>
    </div>
    <div class="section">
        <h2>4. Total Price</h2>
        <p id="totalPrice"></p>
    </div>
    <div class="section">
        <h2>5. Find Product</h2>
        <p id="foundProduct"></p>
    </div>
    <div class="section">
        <h2>6. Optional Chaining</h2>
        <p id="city"></p>
    </div>
    <script>
        const studentName = "Kishori";
        const message = `Hello ${studentName}, Welcome to Day 4!`;
        document.getElementById("message").textContent = message;
        const products = [
            {
                name: "Laptop",
                price: 50000,
                category: "Electronics"
            },
            {
                name: "Mouse",
                price: 800,
                category: "Electronics"
            },
            {
                name: "Keyboard",
                price: 1200,
                category: "Electronics"
            },
            {
                name: "Notebook",
                price: 300,
                category: "Stationery"
            },
            {
                name: "Pen",
                price: 100,
                category: "Stationery"
            }
        ];
        const cheapProducts = products.filter(
            product => product.price < 1000
        );
        const cheapProductsDiv =
            document.getElementById("cheapProducts");
            cheapProducts.forEach(product => {
            cheapProductsDiv.innerHTML += `
                <div class="product">
                    ${product.name} - ₹${product.price}
                </div>
            `;
         });
        const productNames = products.map(
            product => product.name
        );
            document.getElementById("productNames").textContent =
            productNames.join(", ");
        const totalPrice = products.reduce(
            (total, product) => total + product.price,
            0
        );
             document.getElementById("totalPrice").textContent =
            `Total Price: ₹${totalPrice}`;
        const foundProduct = products.find(
            product => product.category === "Electronics"
        );
        document.getElementById("foundProduct").textContent =
            `Found Product: ${foundProduct.name}`;
        const user = {
            name: "Kishori",
            address: {
                city: "Pune"
            }
        };
        const userCity = user?.address?.city;
        document.getElementById("city").textContent =
            `City: ${userCity}`;
        products.forEach(product => {
            console.log(
                `Product: ${product.name}, Price: ₹${product.price}`
            );
        });
        const calculateDiscount = (price) => {
            return price * 0.10;
        };
         console.log(
            "Discount on Laptop:",
            calculateDiscount(50000)
        );
        const newProduct = {
            name: "Headphones",
            price: 1500,
            category: "Electronics"
        };
         const updatedProducts = [
            ...products,
            newProduct
        ];
         console.log("Updated Products:", updatedProducts);
        console.log("Day 4 Modern JavaScript Completed!");
    </script>
</body>
</html>
